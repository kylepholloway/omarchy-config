# DavMail gateway — presents Microsoft 365 as plain IMAP/CalDAV/SMTP locally,
# so any standards-based client can read Exchange mail *and* calendars.
#
# O365Graph talks Microsoft Graph rather than EWS, which Microsoft begins
# disabling 2026-10-01 and retires 2027-04-01.
davmail.mode=O365Graph

# Headless: run as a service, no tray icon or settings window.
davmail.server=true

# Bind loopback only. Nothing on the network can reach the gateway.
davmail.bindAddress=127.0.0.1
davmail.allowRemote=false

# Local ports for mail clients to connect to.
davmail.imapPort=1143
davmail.caldavPort=1080
davmail.smtpPort=1025
davmail.ldapPort=1389
davmail.popPort=0

# Keep the OAuth token so login is not repeated every start.
davmail.oauth.persistToken=true

# Show Teams/online meeting joins on events created outside Outlook.
davmail.caldavAutoSchedule=true

# Logging: quiet by default; raise to DEBUG when diagnosing auth.
log4j.logger.davmail=WARN
log4j.logger.httpclient.wire=WARN
davmail.logFilePath=
davmail.logFileSize=1MB
