# Kyle's Ghostty preferences, carried over from the Mac (~/.config/ghostty/config, Oct 2026)
# and adapted for Omarchy. Loaded last from ~/.config/ghostty/config, so these win.
# Colors come from the Omarchy theme (banana-blueberry ships its own ghostty.conf).
# Reload: Ctrl+Shift+, in Ghostty, or `omarchy restart terminal`.

# --- Font ---
# Mac: JetBrains Mono 13 on Retina. Linux counts points at 96 dpi (macOS at 72),
# so 10 here renders about the same size on the 5K displays at 2x.
font-family = "JetBrainsMono Nerd Font"
font-size = 10
adjust-cell-height = 8%

# --- Cursor ---
cursor-style = block
cursor-style-blink = false
# Mac had cursor,sudo,title; ssh-env is Omarchy's (keeps terminfo working over SSH).
shell-integration-features = cursor,sudo,title,ssh-env

# --- Window ---
# Hyprland supplies the blur behind translucent windows.
background-opacity = 0.93
window-padding-x = 12
window-padding-y = 8
window-padding-balance = true
confirm-close-surface = false

# --- Behavior ---
mouse-hide-while-typing = true
copy-on-select = clipboard
clipboard-paste-protection = true
scrollback-limit = 20000000

# --- Splits ---
# The Mac used Cmd (cmd+d, cmd+shift+d, cmd+alt+arrows, cmd+shift+enter). Super belongs to
# Hyprland here, so these use Ctrl+Shift, the Linux convention, with the same letters.
keybind = ctrl+shift+d=new_split:right
keybind = ctrl+shift+alt+d=new_split:down
keybind = ctrl+shift+enter=toggle_split_zoom
# Moving between splits: Ghostty's default ctrl+alt+arrows (Mac was cmd+alt+arrows).

# --- Drop-down terminal (Mac: Cmd+`) ---
# Omarchy has this built in: Super+` toggles its Quake console (a terminal that slides down
# over the current workspace), and Super+Shift+` sends a window into it. Ghostty's own
# quick terminal is not used: its global Super+` clashed with that binding.
